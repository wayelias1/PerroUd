<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doggy</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- ENCABEZADO -->
        <header class="header">
            <h1 class="logo-title">Doggy</h1>
            <button id="btnSettings" class="btn-settings-icon" type="button" title="Configuración">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="content">
            <div class="controls-wrapper">
                
                <!-- LABEL Y BOTONES DE TIEMPO -->
                <label class="control-label">Time buttons:</label>
                <div class="row-buttons">
                    <button id="btnTimeLeft" class="btn-primary" type="button">◀ Anterior</button>
                    <button id="btnTimeRight" class="btn-primary" type="button">Siguiente ▶</button>
                </div>
                
                <!-- LABEL Y BOTÓN UD -->
                <label class="control-label">Show 0 UD:</label>
                <button id="btnIniciar" class="btn-primary full-width" type="button">UD</button>
            </div>
        </main>
    </div>

    <!-- MODAL DE CONFIGURACIÓN -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
            <h2>Settings</h2>
            <button id="btn-close-modal" class="btn-close">&times;</button>
            </div>

            <!-- Theme Switch -->
            <div class="setting-group">
            <span class="setting-label">Theme</span>
            <div class="theme-switch">
                <button id="theme-light" class="switch-btn active">Light</button>
                <button id="theme-dark" class="switch-btn">Dark</button>
            </div>
            </div>

            <!-- Accent Color -->
            <div class="setting-group vertical">
            <span class="setting-label">Accent Color</span>
            <div class="color-grid">
                <button class="color-dot active" data-color="#007bff" style="background-color: #007bff;"></button>
                <button class="color-dot" data-color="#10b981" style="background-color: #10b981;"></button>
                <button class="color-dot" data-color="#f59e0b" style="background-color: #f59e0b;"></button>
                <button class="color-dot" data-color="#ef4444" style="background-color: #ef4444;"></button>
                <button class="color-dot" data-color="#8b5cf6" style="background-color: #8b5cf6;"></button>
                <button class="color-dot" data-color="#ec4899" style="background-color: #ec4899;"></button>
                <button class="color-dot" data-color="#06b6d4" style="background-color: #06b6d4;"></button>
                <button class="color-dot" data-color="#64748b" style="background-color: #64748b;"></button>
            </div>
            </div>
        </div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
